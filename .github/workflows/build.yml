name: Build Loaphone
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf build-essential pkg-config
      - run: npm ci
      - name: Rizin for headless REA tests
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/rizin.tar.xz https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-v0.9.1-static-x86_64.tar.xz
          sudo mkdir -p /opt/rizin && sudo tar -xJf /tmp/rizin.tar.xz -C /opt/rizin
          echo /opt/rizin/bin >> "$GITHUB_PATH"
      - name: Rust tests
        if: runner.os == 'Linux'
        working-directory: src-tauri
        env:
          LOAPHONE_REQUIRE_RIZIN: "1"
        run: rizin -v && cargo test
      - uses: tauri-apps/tauri-action@v0
      - uses: actions/upload-artifact@v4
        with:
          name: loaphone-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
